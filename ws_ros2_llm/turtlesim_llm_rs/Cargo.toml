[package]
name = "MecHaRo-Lab_turtlesim_llm_rs"
version = "0.0.1"
authors = ["Michał Mazur <micmazur@pg.edu.pl>"]
edition = "2021"

[[bin]]
name = "turtlesim_llm"
path = "src/llm.rs"

[[bin]]
name = "waypoint_follower"
path = "src/waypoint_follower.rs"

[dependencies]
anyhow = {version = "1", features = ["backtrace"]}
rclrs = { git = "https://github.com/micmzr/ros2_rust.git" }
ros-env = "0.3"
rosidl_runtime_rs = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
foundry-local-sdk = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tokio-stream = "0.1"       # for StreamExt on streaming responses

[profile.dev]
opt-level = 3
debug-assertions = false
overflow-checks = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
